name: Daily garden

# Every morning: yesterday's contributions water the car, and the sign's
# day counter ticks over.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garden
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Water with yesterday's commits
        run: node scripts/garden.mjs daily
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md garden
          git diff --cached --quiet && exit 0
          git commit -m "$(cat garden/.commit-message)"
          git push
